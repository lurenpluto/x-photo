[server]
bind_addr = "0.0.0.0:8080"

[database]
url = "sqlite://xphoto.db"

[logging]
dir = "logs"
level = "info"

[storage]
allow_delete = false

[scan]
max_concurrent_jobs = 2
checkpoint_every = 50
resume_enabled = true
task_dispatch_interval_ms = 2000

[album_rules]
enabled = true
date_delimiters = [".", "_", "-"]

[[album_rules.regex_patterns]]
key = "date_chinese"
regex = "^(?<date>\\d{4}年\\d{2}月\\d{2}日)[._-](?<name>.+)$"
date_capture = "date"
name_capture = "name"
date_input_format = "%Y年%m月%d日"
