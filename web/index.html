<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>X-Photo Console</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="bg-noise"></div>
    <main class="page">
      <section class="hero panel">
        <div>
          <p class="eyebrow">X-PHOTO V1</p>
          <h1>前端控制台</h1>
          <p class="subtitle">按“资源管理 → 任务中心 → 照片浏览”推进联调与产品化设计。</p>
        </div>
        <div class="hero-side">
          <label for="apiBase">API Base</label>
          <input id="apiBase" value="http://127.0.0.1:8080/rpc/v1" />
          <button id="btnHealth" class="btn">检查服务健康</button>
          <p id="healthStatus" class="hint">等待检查...</p>
        </div>
      </section>

      <nav class="route-nav panel reveal" id="routeNav">
        <a href="#resources" data-route="resources" class="route-link">资源管理</a>
        <a href="#tasks" data-route="tasks" class="route-link">任务中心</a>
        <a href="#photos" data-route="photos" class="route-link">照片浏览</a>
      </nav>

      <section id="route-resources" class="route-section">
        <section class="grid-2">
          <article class="panel reveal">
            <h2>Source 管理</h2>
            <form id="sourceForm" class="form">
              <label for="sourceName">名称</label>
              <input id="sourceName" placeholder="例如：家庭照片盘" required />
              <label for="sourcePath">路径</label>
              <input id="sourcePath" placeholder="例如：/tmp/xphoto_test_data" required />
              <button class="btn" type="submit">创建 Source</button>
            </form>
            <p id="sourceMessage" class="hint"></p>
          </article>

          <article class="panel reveal delay-1">
            <div class="panel-title">
              <h2>Source 列表</h2>
              <button id="btnReloadSources" class="btn ghost">刷新</button>
            </div>
            <div id="sourceList" class="list"></div>
          </article>
        </section>

        <section class="panel reveal delay-2">
          <div class="panel-title">
            <h2>相册列表</h2>
            <button id="btnAlbums" class="btn ghost">刷新</button>
          </div>
          <div id="albumList" class="list"></div>
        </section>
      </section>

      <section id="route-tasks" class="route-section">
        <section class="grid-2">
          <article class="panel reveal">
          <div class="panel-title">
            <h2>任务总览</h2>
            <div class="title-actions">
              <span id="taskAutoRefreshHint" class="hint">自动刷新中</span>
              <button id="btnTaskOverview" class="btn ghost">刷新</button>
            </div>
          </div>
            <div id="taskOverview" class="list"></div>
          </article>

          <article class="panel reveal delay-1">
            <div class="panel-title">
              <h2>任务列表</h2>
              <button id="btnTaskList" class="btn ghost">刷新</button>
            </div>
            <form id="taskFilterForm" class="inline-form task-filters compact">
              <input id="taskJobType" placeholder="job_type，如 scan" />
              <input id="taskTriggerType" placeholder="trigger_type，如 manual" />
              <input id="taskStatus" placeholder="状态过滤，如 running" />
              <button class="btn" type="submit">筛选</button>
            </form>
            <div id="taskList" class="list"></div>
          </article>
        </section>

        <section class="panel reveal delay-2">
          <div class="panel-title">
            <h2>任务详情</h2>
            <span id="taskDetailHint" class="hint">请选择一个任务</span>
          </div>
          <div class="task-detail-grid">
            <article>
              <h3>状态流</h3>
              <ol id="taskFlow" class="flow"></ol>
            </article>
            <article>
              <h3>详细信息</h3>
              <div id="taskDetail" class="kv"></div>
              <div class="task-actions">
                <button id="btnCancelTask" class="btn ghost" disabled>取消任务</button>
                <button id="btnRetryTask" class="btn" disabled>重试任务</button>
                <button id="btnCancelScan" class="btn ghost" disabled>取消扫描</button>
                <button id="btnRetryScan" class="btn" disabled>重试扫描</button>
              </div>
            </article>
          </div>
        </section>
      </section>

      <section id="route-photos" class="route-section">
        <section class="panel reveal">
          <div class="panel-title">
            <h2>照片检索</h2>
          </div>
          <form id="photoSearchForm" class="inline-form photo-search">
            <input id="photoKeyword" placeholder="关键词（文件名 / 备注）" />
            <select id="photoAlbumFilter">
              <option value="">全部相册</option>
            </select>
            <select id="photoOrder">
              <option value="desc">时间倒序</option>
              <option value="asc">时间正序</option>
            </select>
            <input id="photoStartDate" type="date" />
            <input id="photoEndDate" type="date" />
            <input id="photoPageSize" type="number" min="1" max="100" value="24" />
            <button class="btn" type="submit">搜索</button>
          </form>
          <div id="photoFilterChips" class="chips"></div>
          <p id="photoMeta" class="hint"></p>
          <div class="pager">
            <button id="btnPhotoPrev" class="btn ghost small" type="button">上一页</button>
            <span id="photoPageHint" class="hint">第 1 页</span>
            <button id="btnPhotoNext" class="btn ghost small" type="button">下一页</button>
          </div>
          <div id="photoGrid" class="photo-grid"></div>
        </section>
      </section>
    </main>

    <aside id="photoDrawer" class="drawer" aria-hidden="true">
      <div class="drawer-backdrop" id="photoDrawerBackdrop"></div>
      <section class="drawer-panel">
        <div class="panel-title">
          <h2>照片详情</h2>
          <div class="title-actions">
            <button id="btnDrawerPrev" class="btn ghost small" type="button">上一张</button>
            <button id="btnDrawerNext" class="btn ghost small" type="button">下一张</button>
            <button id="btnCloseDrawer" class="btn ghost small" type="button">关闭</button>
          </div>
        </div>
        <div id="photoDetail" class="kv"></div>
        <div>
          <h3>所在相册</h3>
          <div id="photoAlbums" class="chips"></div>
        </div>
        <div class="form">
          <label for="photoRemark">备注</label>
          <textarea id="photoRemark" rows="3" placeholder="输入备注"></textarea>
          <button id="btnSaveRemark" class="btn">保存备注</button>
        </div>
        <div class="form">
          <label for="photoAlbumSelect">加入相册</label>
          <select id="photoAlbumSelect"></select>
          <button id="btnAddToAlbum" class="btn">加入相册</button>
        </div>
        <p id="photoDetailMsg" class="hint"></p>
      </section>
    </aside>

    <template id="sourceItemTpl">
      <div class="list-item">
        <div>
          <p class="item-title"></p>
          <p class="item-sub"></p>
        </div>
        <button class="btn small">触发扫描</button>
      </div>
    </template>

    <script src="./app.js" type="module"></script>
  </body>
</html>
